# Cloudflare Worker 배포 설정 (앱 본체는 GitHub Pages라 여기와 무관하다)
#   배포: npx wrangler deploy
#   비밀값(ANTHROPIC_API_KEY)은 여기 적지 않는다. 대시보드나 `wrangler secret put` 으로 넣고,
#   배포할 때는 기존 값이 그대로 유지된다.

name = "biz-translator-api"
main = "worker/index.js"
compatibility_date = "2026-09-21"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "biz-translator-db"
database_id = "2383dcd4-124d-4136-b390-04748b5c1ced"
